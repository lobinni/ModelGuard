name: ModelGuard CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  contract-regression:
    name: Contract regression (43 tests)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-test.txt

      - name: Install pinned test dependency
        run: python -m pip install -r requirements-test.txt

      - name: Run deterministic contract suite
        run: python -m pytest -q

  web-production-build:
    name: Next.js production build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Generate Next.js route types
        run: npx next typegen

      - name: Type-check
        run: npm exec tsc -- --noEmit --pretty false

      - name: Build production bundle without a database
        env:
          NEXT_PUBLIC_CONTRACT_ADDRESS: ""
        run: npm run build
